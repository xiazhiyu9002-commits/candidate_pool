name: CI

on:
  push:
    branches: [main, master, feature/*]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run backend tests
        run: pytest -q

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Create packaging environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e "backend[dev]"

      - name: Install dependencies
        run: npm ci
        working-directory: desktop

      - name: Validate platform configs
        run: npm run validate:platforms
        working-directory: desktop

      - name: Type check
        run: npx tsc -b
        working-directory: desktop

      - name: Run unit tests
        run: npm test
        working-directory: desktop

      - name: Build Windows sidecar
        run: .\backend\packaging\build_sidecar.ps1

      - name: Run Rust shell tests
        run: cargo test
        working-directory: desktop/src-tauri

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: desktop

      - name: Run browser workflows
        run: npm run test:e2e
        working-directory: desktop

      - name: Build NSIS installer
        run: npm run tauri:build:windows
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  desktop-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Create packaging environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e "backend[dev]"

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Verify native architecture
        run: test "$(uname -m)" = "arm64"

      - name: Run backend tests
        run: ../.venv/bin/python -m pytest -q
        working-directory: backend

      - name: Validate platform configs and desktop tests
        run: |
          npm run validate:platforms
          npm test
          npm run build
        working-directory: desktop

      - name: Build Apple Silicon sidecar
        run: bash backend/packaging/build_sidecar_macos.sh

      - name: Run Rust shell tests
        run: cargo test
        working-directory: desktop/src-tauri

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: desktop

      - name: Run browser workflows
        run: npm run test:e2e
        working-directory: desktop

      - name: Build unsigned app and DMG
        run: npm run tauri:build:macos
        working-directory: desktop

      - name: Inspect artifact architectures
        run: |
          file desktop/src-tauri/binaries/kerui-recruit-sidecar
          lipo -archs desktop/src-tauri/binaries/kerui-recruit-sidecar | grep -q arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
